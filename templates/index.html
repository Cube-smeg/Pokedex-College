
{% extends 'base.html' %}

{% block content %}
    <div class="pokemon-container">
        <div class="pokemon-card">
            <h1 class="pokemon-name">Pokemon name</h1>
            <img class="pokemon-image" src="{{ url_for('images', filename='placeholder-espion.png') }}">
            <p>Index Num: <span class="pokemon-id">—</span></p>
            <p>Type: <span class="pokemon-types">—</span></p>
            <p>Strengths <span class="Strengths">Loading...</span></p>
            <p>Weaknesses <span class="Weaknesses">Loading...</span></p>
        </div>
    </div>

    <div class="pokemon-stat-container">
        <div class="pokemon-stat-text">
            <p>HP: <span class="health">Loading...</span></p>
            <p>ATK: <span class="attack">Loading...</span></p>
            <p>SP.ATK: <span class="spec-atk">Loading...</span></p>
            <p>DEF: <span class="defence">Loading...</span></p>
            <p>SP.DEF: <span class="spec-def">Loading...</span></p>
            <p>SPD: <span class="speed">Loading...</span></p>
        </div>
    </div>

    <div class="Pokemon-Search">
        <form id="pokemon-search-form">
            <input type="text" id="pokemon-search" placeholder="Search for a Pokemon..." aria-label="Pokemon name">
            <button type="submit">Search</button>
        </form>
        <p id="search-message" role="status" aria-live="polite"></p>
    </div>
    <div class="randomize-button">
        <button id="randomize-button" type="button">Randomize</button>
    </div>
{% endblock %}
