{% extends 'base.html' %}

{% block body_class %}teambuilder{% endblock %}

{% block content %}

<!-- Main navigation -->
<nav class="navigation" aria-label="Main navigation">
    <div class="navigation-inner">
        <a class="navigation-brand" href="{{ url_for('index') }}">Pokédex</a>
        <div class="navigation-links">
            <a class="navigation-link" href="{{ url_for('index') }}">Pokémon</a>
            <a class="navigation-link navigation-link-active" href="{{ url_for('teambuilder') }}" aria-current="page">Team Builder</a>
            <button class="navigation-logout" id="logout" type="button">Log out</button>
        </div>
    </div>
</nav>

<!-- Team selection -->
<section class="teambuilder-container">
    <div class="teambuilder-header">
        <h1>Team Builder</h1>
        <p>Build your pokemon team</p>
    </div>

    <div class="team-selection">
        <div class="team-slot" id="team-slot-1">
            <div class="team-pokemon-artwork">
                <img class="team-pokemon-image" id="team-slot-1-image" src="{{ url_for('images', filename='placeholder-espion.png') }}" alt="Pokemon placeholder">
            </div>
            <p class="team-pokemon-name">Pokemon: <span class="pokemon-name">—</span></p>
            <form class="team-pokemon-search" id="team-search-form-1">
                <label class="visually-hidden" for="team-search-1">Search Pokemon for team slot 1</label>
                <input id="team-search-1" name="pokemon" type="search" placeholder="Search Pokemon..." required>
                <button type="submit">Select Pokemon</button>
            </form>
            <p class="team-search-message" id="team-message-1" role="status" aria-live="polite"></p>
        </div>

        <div class="team-slot" id="team-slot-2">
            <div class="team-pokemon-artwork">

            <p class="team-pokemon-name">Pokemon: <span class="pokemon-name">—</span></p>
            <form class="team-pokemon-search" id="team-search-form-3">

    <div class="finalize-team">
        <button id="finalize-team-button" type="button">Finalize Team</button>
    </div>

    <div class="add-pokemon-button">
        <button id="load_team_button" type="button">Load your saved team!</button>
    </div>
</section>
